name: Update Dalamud plugin repository

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: GitHub release tag to publish in repo.json
        required: true
        type: string

permissions:
  contents: write

jobs:
  update-repository:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository feed
        uses: actions/checkout@v5
        with:
          ref: main

      - name: Resolve release metadata
        id: release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_EVENT_TAG: ${{ github.event.release.tag_name }}
          MANUAL_TAG: ${{ inputs.tag }}
        run: |
          $tag = if ($env:RELEASE_EVENT_TAG) { $env:RELEASE_EVENT_TAG } else { $env:MANUAL_TAG }
          $release = gh release view $tag --repo $env:GITHUB_REPOSITORY --json publishedAt | ConvertFrom-Json
          $lastUpdate = [DateTimeOffset]::Parse($release.publishedAt).ToUnixTimeSeconds()
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "last_update=$lastUpdate" >> $env:GITHUB_OUTPUT

      - name: Download the plugin archive
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          New-Item -ItemType Directory -Path artifacts | Out-Null
          gh release download $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --pattern latest.zip --dir artifacts

      - name: Generate repo.json
        shell: pwsh
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          LAST_UPDATE: ${{ steps.release.outputs.last_update }}
        run: |
          $downloadUrl = "https://github.com/$env:GITHUB_REPOSITORY/releases/download/$env:RELEASE_TAG/latest.zip"
          ./scripts/Update-PluginRepo.ps1 `
            -PluginZip ./artifacts/latest.zip `
            -DownloadUrl $downloadUrl `
            -LastUpdate $env:LAST_UPDATE `
            -OutputPath ./repo.json

      - name: Validate and publish the feed
        shell: bash
        run: |
          jq --exit-status 'length == 1 and .[0].InternalName == "MasterOfPuppets" and .[0].DownloadLinkInstall != null' repo.json
          if git diff --quiet -- repo.json; then
            echo "repo.json already advertises this release."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add repo.json
          git commit -m "Update plugin repository for ${{ steps.release.outputs.tag }}"
          git push origin HEAD:main
